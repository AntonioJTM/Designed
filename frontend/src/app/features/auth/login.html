<div class="auth-card">
  <h1>Iniciar sesión</h1>
  <p class="sub">Tienda de hilos · acceso a la plataforma</p>

  <form [formGroup]="form" (ngSubmit)="enviar()">
    <label>
      Correo
      <input type="email" formControlName="correo" autocomplete="username" placeholder="correo@ejemplo.com" />
    </label>

    <label>
      Contraseña
      <input type="password" formControlName="contrasena" autocomplete="current-password" placeholder="••••••••" />
    </label>

    @if (error()) {
      <p class="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <p class="pie">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
</div>
