<!--
  No se cierra al hacer clic en el fondo: se sale con la ✕, con "Cancelar" o con
  Escape.
-->
<div class="modal-overlay">
  <div class="modal angosto" role="dialog" aria-modal="true" aria-labelledby="modal-cuenta-titulo">
    <div class="modal-head">
      <h2 id="modal-cuenta-titulo">{{ esEdicion() ? 'Editar cuenta' : 'Agregar cuenta' }}</h2>
      <button type="button" class="modal-cerrar" (click)="cerrar()" aria-label="Cerrar">✕</button>
    </div>

    <form (ngSubmit)="guardar()">
      <div class="modal-body">
        <div class="columna" style="gap: 16px">
          @if (error()) { <p class="alert" style="margin: 0">{{ error() }}</p> }

          <p class="muted" style="margin: 0; font-size: 14px">
            La cuenta a la que un cliente deposita cuando paga por transferencia. Lleva el número de cuenta,
            la CLABE o los dos.
          </p>

          <div class="form-grid">
            <label class="field">
              Banco
              <input type="text" [(ngModel)]="form.banco" name="banco" list="bancos-mx" maxlength="80"
                     placeholder="Ej. BBVA" required />
              <datalist id="bancos-mx">
                @for (b of BANCOS; track b) { <option [value]="b"></option> }
              </datalist>
            </label>
            <label class="field">
              <span>A nombre de <span class="muted">(opcional)</span></span>
              <input type="text" [(ngModel)]="form.titular" name="titular" maxlength="120"
                     placeholder="Quién aparece como titular" />
            </label>
            <label class="field">
              Número de cuenta
              <input type="text" inputmode="numeric" [(ngModel)]="form.numero_cuenta" name="numero" maxlength="30"
                     placeholder="Ej. 0123456789" autocomplete="off" />
              <span class="ayuda">El que viene en el estado de cuenta o en la tarjeta.</span>
            </label>
            <label class="field">
              CLABE
              <input type="text" inputmode="numeric" [(ngModel)]="form.clabe" name="clabe" maxlength="30"
                     placeholder="18 dígitos" autocomplete="off" />
              @if (avisoClabe(); as a) {
                <span class="ayuda" [style.color]="a.ok ? 'var(--ok-t)' : 'var(--alerta-t)'">{{ a.texto }}</span>
              } @else {
                <span class="ayuda">Para transferencias desde otro banco (SPEI).</span>
              }
            </label>
            <label class="field check full">
              <input type="checkbox" [(ngModel)]="form.activa" name="activa" /> Activa: se le da a los clientes
            </label>
          </div>
        </div>
      </div>

      <div class="modal-foot">
        @if (esEdicion()) {
          <button type="button" class="btn btn-danger" style="margin-right: auto" [disabled]="guardando()" (click)="eliminar()">
            Quitar
          </button>
        }
        <button type="button" class="btn btn-ghost" (click)="cerrar()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="guardando()">
          {{ guardando() ? 'Guardando…' : esEdicion() ? 'Guardar cambios' : 'Agregar cuenta' }}
        </button>
      </div>
    </form>
  </div>
</div>
