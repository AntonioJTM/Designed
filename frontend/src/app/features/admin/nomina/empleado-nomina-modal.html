<!--
  No se cierra al hacer clic en el fondo, igual que los demás modales del panel:
  un clic distraído borraría la captura. Se sale con la ✕, con "Cancelar" o con
  Escape.
-->
<div class="modal-overlay">
  <div class="modal angosto" role="dialog" aria-modal="true" aria-labelledby="modal-empleado-titulo">
    <div class="modal-head">
      <h2 id="modal-empleado-titulo">
        {{ empleado().nombre }}
        <span class="muted" style="font-weight: 400; font-size: 15px; text-transform: capitalize"> · {{ empleado().rol }}</span>
      </h2>
      <button type="button" class="modal-cerrar" (click)="cerrar()" aria-label="Cerrar">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="modal-body">
        <div class="columna" style="gap: 16px">
          @if (error()) { <p class="alert" style="margin: 0">{{ error() }}</p> }

          <div class="form-grid">
            <label class="field">
              Sueldo base semanal
              <input type="number" step="0.01" min="0" formControlName="sueldo_base_semanal" />
              <span class="ayuda">En pesos, por semana de domingo a sábado.</span>
            </label>
            <label class="field">
              Valor de la hora extra
              <input type="number" step="0.01" min="0" formControlName="valor_hora_extra" />
              <span class="ayuda">En pesos. Se usa si el ajuste del recibo no trae importe.</span>
            </label>
            <label class="field check full">
              <input type="checkbox" formControlName="paga_comision" /> Recibe comisión por ventas
            </label>
            @if (form.controls.paga_comision.value) {
              <label class="field">
                Porcentaje de comisión (%)
                <input type="number" step="0.01" min="0" max="100" formControlName="porcentaje_comision" />
                <span class="ayuda">Sobre la venta neta: sin IVA, sin envío, sin lo cancelado.</span>
              </label>
            }
            <label class="field check full">
              <input type="checkbox" formControlName="activo" /> En nómina: entra en el cálculo de la semana
            </label>
          </div>
        </div>
      </div>

      <div class="modal-foot">
        @if (empleado().en_nomina && empleado().activo) {
          <button type="button" class="btn btn-danger" style="margin-right: auto" [disabled]="guardando()" (click)="sacar()">
            Sacar de la nómina
          </button>
        }
        <button type="button" class="btn btn-ghost" (click)="cerrar()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="guardando()">
          {{ guardando() ? 'Guardando…' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
</div>
